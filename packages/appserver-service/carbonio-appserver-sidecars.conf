# Drop-in for carbonio-appserver.service, installed only on distros that ship
# the modern (service-discover-wrapper) sidecars; the main unit is also shipped
# on legacy distros, where it must stay unchanged. Starting the appserver pulls
# in the admin and nslookup sidecars (Wants only, never Requires: a sidecar
# skipped by its token condition must not block the appserver). They are
# inbound-only and already ordered After=carbonio-appserver.service. All five
# sidecars declare PartOf=carbonio-appserver.service, so stop/restart propagate.
[Unit]
Wants=carbonio-mailbox-admin-sidecar.service carbonio-mailbox-nslookup-sidecar.service
