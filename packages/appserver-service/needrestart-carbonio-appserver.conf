#
# mailboxd's java.io.tmpdir (/opt/zextras/mailboxd/work, formerly
# /opt/zextras/jetty_base/work) holds files that are unlinked while still
# in use: zstd-jni's extracted native lib and the jars the OpenTelemetry
# eBPF (OBI) java agent unpacks. needrestart would otherwise flag
# carbonio-appserver.service on every apt/dpkg transaction (CO-3996, CO-4287).
# Same treatment needrestart's stock config gives /tmp.
$nrconf{blacklist_mappings} = [
    @{$nrconf{blacklist_mappings}},
    qr#^/opt/zextras/(mailboxd|jetty_base)/work/#,
];
$nrconf{blacklist_interp} = [
    @{$nrconf{blacklist_interp}},
    qr#^/opt/zextras/(mailboxd|jetty_base)/work/#,
];
