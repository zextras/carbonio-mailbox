#
# zstd-jni's extracted native lib in jetty_base/work/ is unlinked while
# still mapped (same pattern as needrestart's stock JNA rule below).
# Blacklist it to stop false-positive restarts on unrelated apt/dpkg
# transactions (CO-3996).
$nrconf{blacklist_mappings} = [
    @{$nrconf{blacklist_mappings}},
    qr#/jetty_base/work/libzstd-jni-[\w.\-]+\.so( \(deleted\))?$#,
];
