openapi: 3.0.1
info:
  title: Carbonio Authz API
  description: Service-to-service authorization API backed by the mailbox rights catalogue
  version: "1.0"
paths:
  /rights/check:
    post:
      summary: Check Right
      description: "Tells whether the subject holds a right (user or admin, as defined\
        \ in the rights catalogue) on the target. The subject is identified by exactly\
        \ one of 'token' or 'accountId'; the target type is a right target type (e.g.\
        \ account, domain, cos). A missing target or subject is reported as not allowed."
      operationId: check
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RightCheckRequest"
      responses:
        "200":
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RightCheckResponse"
        "400":
          description: "Invalid request, unknown right or target type, or right not\
            \ applicable to the target type"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rights:
    get:
      summary: List Rights
      description: "Returns the rights from the rights catalogue that can be checked\
        \ on the given target type. Combo rights are not listed: they bundle rights\
        \ for different target types and are meant to be granted, not checked."
      operationId: listRights
      parameters:
      - name: targetType
        in: query
        description: "The target type, e.g. account, domain, cos"
        schema:
          type: string
      responses:
        "200":
          description: Rights applicable to the target type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RightInfoResponse"
        "400":
          description: Missing or unknown target type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    RightCheckResponse:
      type: object
      properties:
        allowed:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    RightCheckRequest:
      type: object
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        right:
          type: string
        target:
          $ref: "#/components/schemas/Target"
    Subject:
      type: object
      properties:
        token:
          type: string
        accountId:
          type: string
    Target:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
    RightInfoResponse:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        userRight:
          type: boolean
        description:
          type: string
